<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control horario</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <section id="auth-view" class="view">
      <div class="brand-block">
        <div class="brand-mark">CH</div>
        <h1>Control horario</h1>
        <p>Fichaje interno con ubicacion puntual.</p>
      </div>
      <div class="segmented">
        <button id="tab-email" class="active" type="button">Movil</button>
        <button id="tab-kiosk" type="button">Kiosko</button>
      </div>
      <form id="email-form" class="panel form-grid">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Contrasena<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <form id="kiosk-form" class="panel form-grid hidden">
        <label>PIN<input name="pin" inputmode="numeric" autocomplete="one-time-code" required></label>
        <button class="primary" type="submit">Abrir fichaje</button>
      </form>
    </section>

    <section id="worker-view" class="view hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mi jornada</p>
          <h2 id="worker-name">Trabajador</h2>
        </div>
        <button id="logout-worker" class="icon-button" type="button" title="Salir">x</button>
      </header>
      <section class="hero-panel">
        <p id="state-label" class="eyebrow">Sin iniciar</p>
        <strong id="hours-label">0:00</strong>
        <span id="location-label">Ubicacion pendiente</span>
      </section>
      <div id="action-buttons" class="action-grid"></div>
      <section class="panel">
        <div class="section-head">
          <h3>Hoy</h3>
          <button id="refresh-worker" type="button">Actualizar</button>
        </div>
        <div id="today-events" class="timeline"></div>
      </section>
      <section class="panel">
        <h3>Solicitar correccion</h3>
        <form id="correction-form" class="form-grid">
          <label>Fecha<input name="date" type="date" required></label>
          <label>Descripcion<textarea name="description" rows="3" required></textarea></label>
          <label>Motivo<input name="reason" required></label>
          <button class="secondary" type="submit">Enviar solicitud</button>
        </form>
      </section>
      <section class="panel">
        <h3>Historial del mes</h3>
        <div id="month-history" class="rows"></div>
      </section>
    </section>

    <section id="admin-view" class="view hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Administracion</p>
          <h2 id="admin-name">Panel</h2>
        </div>
        <button id="logout-admin" class="icon-button" type="button" title="Salir">x</button>
      </header>
      <section class="panel">
        <div class="section-head">
          <h3>Estado de hoy</h3>
          <button id="refresh-admin" type="button">Actualizar</button>
        </div>
        <div id="admin-dashboard" class="rows"></div>
      </section>
      <section class="panel">
        <div class="section-head">
          <h3>Correcciones</h3>
          <button id="load-corrections" type="button">Ver pendientes</button>
        </div>
        <div id="corrections-list" class="rows"></div>
      </section>
      <section class="panel two-col">
        <form id="user-form" class="form-grid">
          <h3>Nuevo trabajador</h3>
          <label>Nombre<input name="name" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Contrasena<input name="password" value="cambiar123" required></label>
          <label>PIN<input name="pin" inputmode="numeric" required></label>
          <label>Horas semana<input name="weekly_hours" type="number" value="40" min="1" step="0.5"></label>
          <button class="secondary" type="submit">Crear</button>
        </form>
        <form id="center-form" class="form-grid">
          <h3>Nuevo centro</h3>
          <label>Nombre<input name="name" required></label>
          <label>Direccion<input name="address"></label>
          <label>Latitud<input name="lat" type="number" step="0.000001" required></label>
          <label>Longitud<input name="lon" type="number" step="0.000001" required></label>
          <label>Radio metros<input name="radius_meters" type="number" value="100" min="10"></label>
          <button class="secondary" type="submit">Guardar centro</button>
        </form>
      </section>
      <section class="panel">
        <h3>Exportacion</h3>
        <div class="export-row">
          <input id="export-month" type="month">
          <a id="export-link" class="primary link-button" href="#">CSV mensual</a>
        </div>
      </section>
    </section>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
